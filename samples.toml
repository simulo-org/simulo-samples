[compat]
simulo = ">=0.23.1,<0.25"

[[samples]]
slug = "hello"
title = "Hello"
robot = "No robot"
task = "Print a few greeting lines from a job and return a small JSON result."
concepts = ["App and jobs", "job flags", "logs and results"]
assets = []
jobs = ["hello"]
gpu = false
difficulty = "introductory"
learning_goal = "Submit a job and read its output"
runtime_minutes = 1
published = true

[[samples]]
slug = "cartpole"
title = "Cartpole"
robot = "Cartpole"
task = "Train a PPO policy that balances a pole on a sliding cart."
concepts = ["Task lifecycle", "LearningEnv and RLTrainer", "Volumes", "ResumableCheckpoint"]
assets = ["simulo/robot/cartpole:v1"]
jobs = ["train_cartpole"]
gpu = true
difficulty = "introductory"
learning_goal = "Train a policy"
runtime_minutes = 2
published = true

[[samples]]
slug = "cartpole-eval"
title = "Cartpole Eval"
robot = "Cartpole"
task = "Train a policy, score it over several rounds, then play it back and record the rollout."
concepts = ["Multiple jobs", "shared volumes", "policy export", "RLPlayer", "MCAP recording", "camera video"]
assets = ["simulo/robot/cartpole:v1"]
jobs = ["train", "evaluate", "rollout"]
gpu = true
difficulty = "intermediate"
learning_goal = "Evaluate and record a policy"
runtime_minutes = 2
published = true

[[samples]]
slug = "humanoid"
title = "Humanoid"
robot = "Bipedal humanoid"
task = "Train a 21-joint biped to stay upright and move forward."
concepts = ["Locomotion", "body-frame observations", "termination versus truncation"]
assets = ["simulo/robot/humanoid:v1"]
jobs = ["train_humanoid"]
gpu = true
difficulty = "intermediate"
learning_goal = "Train a policy"
runtime_minutes = 5
published = true
